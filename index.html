<!DOCTYPE html>
<html>
  <head>
    <title>AR.js Custom Surface Example</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.4/aframe/build/aframe-ar-nft.js"></script>
    <script>
      const uSegments = 40, vSegments = 40;
      function CreateSurfaceData() {
        let vertices = [];
        let indices = [];

        const scale = 0.5;
        const a = 1.5 * scale, b = 3.0 * scale, c = 2.0 * scale, d = 2.0 * scale;

        function f(v) {
          return (a * b) / Math.sqrt((a ** 2) * Math.sin(v) ** 2 + (b ** 2) * Math.cos(v) ** 2);
        }

        for (let i = 0; i <= uSegments; i++) {
          const t = (i / uSegments) * 2 * Math.PI;
          for (let j = 0; j <= vSegments; j++) {
            const v = (j / vSegments) * 2 * Math.PI;
            const fv = f(v);
            const cosT = Math.cos(t);
            const sinT = Math.sin(t);
            const cosV = Math.cos(v);
            const sinV = Math.sin(v);

            const x = 0.5 * (fv * (1 + cosT) + (d ** 2 - c ** 2) * (1 - cosT) / fv) * cosV;
            const y = 0.5 * (fv * (1 + cosT) + (d ** 2 - c ** 2) * (1 - cosT) / fv) * sinV;
            const z = 0.5 * (fv - (d ** 2 - c ** 2) / fv) * sinT;

            vertices.push(x, y, z);
          }
        }

        for (let i = 0; i < uSegments; i++) {
          for (let j = 0; j < vSegments; j++) {
            const p0 = i * (vSegments + 1) + j;
            const p1 = p0 + 1;
            const p2 = (i + 1) * (vSegments + 1) + j;
            const p3 = p2 + 1;

            indices.push(p0, p1, p2);
            indices.push(p1, p3, p2);
          }
        }

        return { vertices, indices };
      }

      AFRAME.registerComponent('custom-surface', {
        schema: {},
        init: function () {
          const data = CreateSurfaceData();
          const geometry = new THREE.BufferGeometry();
          const vertices = new Float32Array(data.vertices);
          const indices = new Uint32Array(data.indices);

          geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
          geometry.setIndex(new THREE.BufferAttribute(indices, 1));
          geometry.computeVertexNormals();

          const material = new THREE.MeshNormalMaterial({ flatShading: true, side: THREE.DoubleSide });

          this.mesh = new THREE.Mesh(geometry, material);
          this.el.setObject3D('mesh', this.mesh);
        },
        remove: function () {
          if (this.mesh) {
            this.el.removeObject3D('mesh');
          }
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      renderer="logarithmicDepthBuffer: true;"
    >
      <a-marker type="pattern" url="pattern-marker.patt">
        <a-entity custom-surface position="0 0 0" scale="0.2 0.2 0.2"></a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
