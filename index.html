<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>PA#2 - Anaglyph Stereo with Webcam Background</title>
    <style>
        html, body {
            height: 100%;
        }
        body {
            background-color: #EEEEEE;
            margin: 0;
            overflow: hidden;
            height: 100%;
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(221, 221, 221, 0.7);
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
        }
        .control-group {
            margin: 5px 0;
        }
        label {
            display: inline-block;
            width: 200px;
        }
        #webgl-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #webglcanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: transparent;
            display: block;
        }
        #webcam-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            display: block;
        }
    </style>

    <script src="./Utils/trackball-rotator.js"></script>
    <script src="./Utils/m4.js"></script>
    <script src="./shader.gpu"></script>
    <script src="./main.js"></script>
</head>
<body onload="init()">

<div id="webgl-container">
    <video id="webcam-video" autoplay muted playsinline></video>
    <canvas id="webglcanvas"></canvas>
</div>

<div id="controls">
    <h2>Anaglyph Stereo Controls</h2>
    <div class="control-group">
        <label for="eyeSeparation">Eye Separation:</label>
        <input type="range" id="eyeSeparation" min="0.1" max="10" value="2" step="0.1">
        <span id="eyeSeparationValue">2</span>
    </div>
    <div class="control-group">
        <label for="fov">Field of View (degrees):</label>
        <input type="range" id="fov" min="10" max="120" value="45" step="1">
        <span id="fovValue">45</span>
    </div>
    <div class="control-group">
        <label for="nearClip">Near Clipping Distance:</label>
        <input type="range" id="nearClip" min="0.1" max="15" value="5" step="0.1">
        <span id="nearClipValue">5</span>
    </div>
    <div class="control-group">
        <label for="convergence">Convergence Distance:</label>
        <input type="range" id="convergence" min="1" max="1000" value="100" step="1">
        <span id="convergenceValue">1000</span>
    </div>
    <div class="control-group">
        <label for="uGranularity">U Granularity:</label>
        <input type="range" id="uGranularity" min="10" max="100" value="30" step="10">
        <span id="uGranularityValue">30</span>
    </div>
    <div class="control-group">
        <label for="vGranularity">V Granularity:</label>
        <input type="range" id="vGranularity" min="10" max="100" value="30" step="10">
        <span id="vGranularityValue">30</span>
    </div>
</div>

</body>
</html>
